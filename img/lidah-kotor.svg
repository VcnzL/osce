<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="tongue" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#e0656a"/>
      <stop offset="1" stop-color="#c43c46"/>
    </radialGradient>
    <radialGradient id="coat" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f4f0e2"/>
      <stop offset=".75" stop-color="#e8e1c6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e8e1c6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="380" fill="#e7b38f"/>
  <!-- mulut terbuka -->
  <ellipse cx="320" cy="170" rx="210" ry="140" fill="#5a1a1e"/>
  <path d="M110 150 Q320 10 530 150 Q500 120 320 95 Q140 120 110 150 Z" fill="#c9726b"/>
  <!-- gigi atas -->
  <g fill="#fbf8f0" stroke="#d8d0c0" stroke-width="1.5">
    <rect x="200" y="98" width="38" height="34" rx="6"/><rect x="240" y="94" width="38" height="38" rx="6"/>
    <rect x="280" y="92" width="38" height="40" rx="6"/><rect x="320" y="92" width="38" height="40" rx="6"/>
    <rect x="360" y="94" width="38" height="38" rx="6"/><rect x="400" y="98" width="38" height="34" rx="6"/>
  </g>
  <!-- lidah dijulurkan -->
  <path d="M170 190 Q170 150 320 145 Q470 150 470 190 Q470 330 320 360 Q170 330 170 190 Z" fill="url(#tongue)" stroke="#a52c36" stroke-width="2"/>
  <!-- selaput putih di tengah, tepi & ujung hiperemis -->
  <path d="M220 185 Q222 160 320 158 Q418 160 420 185 Q420 280 320 305 Q220 280 220 185 Z" fill="url(#coat)"/>
  <path d="M320 165 L320 300" stroke="#cfc6a6" stroke-width="3" opacity=".7"/>
  <g fill="#d9d0b2" opacity=".8">
    <circle cx="270" cy="200" r="3"/><circle cx="300" cy="220" r="2.5"/><circle cx="350" cy="205" r="3"/><circle cx="375" cy="235" r="2.5"/>
    <circle cx="285" cy="250" r="2.5"/><circle cx="340" cy="260" r="3"/><circle cx="310" cy="190" r="2.5"/>
  </g>
  <g font-size="15" fill="#13243a">
    <line x1="320" y1="215" x2="560" y2="60" stroke="#13243a" stroke-width="1.5"/>
    <rect x="470" y="22" width="160" height="44" rx="8" fill="#fff"/>
    <text x="480" y="41">Selaput putih</text>
    <text x="480" y="58">di bagian tengah</text>
    <line x1="455" y1="250" x2="560" y2="300" stroke="#13243a" stroke-width="1.5"/>
    <rect x="470" y="300" width="160" height="44" rx="8" fill="#fff"/>
    <text x="480" y="319">Tepi &amp; ujung</text>
    <text x="480" y="336">hiperemis</text>
    <rect x="12" y="18" width="190" height="28" rx="8" fill="#fff"/>
    <text x="22" y="37" font-weight="600">Lidah kotor (coated tongue)</text>
  </g>
  <text x="12" y="370" font-size="12" fill="#3a2a20">Ilustrasi skematik, bukan foto klinis</text>
</svg>
