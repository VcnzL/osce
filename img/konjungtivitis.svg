<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="skin" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#e9b996"/>
      <stop offset="1" stop-color="#c98f6c"/>
    </radialGradient>
    <radialGradient id="sclera" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fbe9e6"/>
      <stop offset="0.55" stop-color="#f3b9b1"/>
      <stop offset="1" stop-color="#d9605a"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#6b4226"/>
      <stop offset="0.7" stop-color="#4a2c18"/>
      <stop offset="1" stop-color="#2a170c"/>
    </radialGradient>
    <clipPath id="eyeClip">
      <path d="M120 200 Q320 60 520 200 Q320 320 120 200 Z"/>
    </clipPath>
  </defs>
  <rect width="640" height="380" fill="url(#skin)"/>
  <!-- alis -->
  <path d="M110 95 Q320 20 540 100" stroke="#3b2a20" stroke-width="18" fill="none" stroke-linecap="round" opacity=".85"/>
  <!-- kelopak atas bengkak -->
  <path d="M100 205 Q320 30 540 205" fill="#d89a7b" stroke="#b8765a" stroke-width="3"/>
  <path d="M112 200 Q320 70 528 200" fill="none" stroke="#c0675a" stroke-width="6" opacity=".55"/>
  <!-- bola mata -->
  <g clip-path="url(#eyeClip)">
    <rect x="100" y="50" width="440" height="300" fill="url(#sclera)"/>
    <!-- pembuluh darah: makin merah ke forniks, pudar ke limbus -->
    <g stroke="#b3261e" fill="none" stroke-linecap="round" opacity=".85">
      <path d="M125 200 Q170 190 205 196 Q225 200 238 194" stroke-width="3"/>
      <path d="M130 215 Q180 220 215 212" stroke-width="2.5"/>
      <path d="M140 175 Q185 170 220 182" stroke-width="2.5"/>
      <path d="M160 160 Q200 165 228 176" stroke-width="2"/>
      <path d="M150 232 Q190 238 222 226" stroke-width="2"/>
      <path d="M515 200 Q470 192 432 198 Q415 202 402 196" stroke-width="3"/>
      <path d="M510 180 Q470 172 425 184" stroke-width="2.5"/>
      <path d="M505 222 Q465 228 420 214" stroke-width="2.5"/>
      <path d="M480 158 Q450 166 418 178" stroke-width="2"/>
      <path d="M485 240 Q450 238 420 226" stroke-width="2"/>
      <path d="M200 140 Q230 150 250 165" stroke-width="1.8"/>
      <path d="M440 140 Q410 150 392 165" stroke-width="1.8"/>
      <path d="M210 260 Q235 250 250 236" stroke-width="1.8"/>
      <path d="M430 262 Q408 250 392 236" stroke-width="1.8"/>
    </g>
    <!-- iris & pupil (kornea jernih) -->
    <circle cx="320" cy="198" r="74" fill="url(#iris)"/>
    <g stroke="#7a5233" stroke-width="1.2" opacity=".6">
      <path d="M320 128 L320 160"/><path d="M370 148 L350 170"/><path d="M390 198 L360 198"/>
      <path d="M370 248 L350 226"/><path d="M320 268 L320 236"/><path d="M270 248 L290 226"/>
      <path d="M250 198 L280 198"/><path d="M270 148 L290 170"/>
    </g>
    <circle cx="320" cy="198" r="30" fill="#0b0705"/>
    <ellipse cx="300" cy="175" rx="14" ry="9" fill="#fff" opacity=".85"/>
    <!-- sekret mukopurulen di kantus medial & margo -->
    <path d="M120 200 Q140 188 165 196 Q160 214 138 214 Z" fill="#d9c64a" opacity=".95"/>
    <circle cx="150" cy="205" r="9" fill="#c5b43a"/>
  </g>
  <!-- kelopak bawah bengkak -->
  <path d="M110 205 Q320 330 530 205" fill="none" stroke="#c0675a" stroke-width="10" opacity=".55"/>
  <path d="M100 205 Q320 345 540 205" fill="none" stroke="#b8765a" stroke-width="4"/>
  <!-- bulu mata dengan krusta -->
  <g stroke="#2b1c14" stroke-width="3" stroke-linecap="round">
    <path d="M170 150 l-12 -20"/><path d="M210 128 l-8 -22"/><path d="M255 112 l-4 -22"/><path d="M300 104 l-1 -22"/>
    <path d="M345 104 l2 -22"/><path d="M390 112 l5 -22"/><path d="M435 128 l9 -21"/><path d="M475 150 l13 -19"/>
  </g>
  <g fill="#d7c547" stroke="#a8952c" stroke-width="1.5">
    <ellipse cx="205" cy="132" rx="11" ry="5"/><ellipse cx="300" cy="106" rx="13" ry="5"/>
    <ellipse cx="420" cy="122" rx="12" ry="5"/><ellipse cx="260" cy="276" rx="14" ry="6"/>
    <ellipse cx="370" cy="282" rx="10" ry="5"/><ellipse cx="128" cy="222" rx="12" ry="8"/>
  </g>
  <!-- label -->
  <g font-size="15" fill="#1a1a1a">
    <line x1="150" y1="215" x2="70" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="12" y="300" width="200" height="44" rx="6" fill="#fff" opacity=".9"/>
    <text x="22" y="320">Sekret mukopurulen</text>
    <text x="22" y="338">di kantus medial &amp; margo</text>
    <line x1="470" y1="200" x2="560" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="430" y="300" width="200" height="44" rx="6" fill="#fff" opacity=".9"/>
    <text x="440" y="320">Injeksi konjungtiva</text>
    <text x="440" y="338">(pudar ke arah limbus)</text>
    <line x1="320" y1="150" x2="380" y2="40" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="330" y="14" width="150" height="28" rx="6" fill="#fff" opacity=".9"/>
    <text x="340" y="33">Kornea jernih</text>
  </g>
  <text x="12" y="372" font-size="12" fill="#3a2a20">Ilustrasi skematik, bukan foto klinis · OS</text>
</svg>
